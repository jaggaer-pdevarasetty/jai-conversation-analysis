sonar.projectKey=jai-conversation-analysis
sonar.projectName=JAI Conversation Analysis
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=node_modules/**,dist/**,public/**,.graph/**,playwright-report/**,test-results/**
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Run locally (not only in CI), e.g.:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
