openapi: 3.1.0
info:
  title: JAI Conversation Analysis — Reviewer API
  version: 0.2.0
  description: >
    Read + override API over the pooled, de-identified common analysis area (J1-93353).
    Attribution: conversations are keyed by conversation_id ONLY — no tenant/user is
    exposed (ADR-0007). Reviewer RBAC. Errors use RFC 7807. FastAPI also serves the live
    spec at /openapi.json; this file is the human-reviewed contract.
servers:
  - url: /
tags:
  - name: analysis
paths:
  /api/analysis/environments:
    get:
      tags: [analysis]
      operationId: listEnvironments
      summary: Environments available for the UI toggle (uit/prod) with per-region reachability
      responses:
        '200':
          description: Environments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        env: { type: string }
                        regions:
                          type: array
                          items:
                            type: object
                            properties:
                              label: { type: string }
                              reachable: { type: [boolean, 'null'] }
                              counts: { type: object, additionalProperties: { type: integer } }
                              error: { type: [string, 'null'] }
                  default: { type: string }
  /api/analysis/conversations:
    get:
      tags: [analysis]
      operationId: listConversations
      summary: List analysed conversations (pooled, category counts, unanalysed count)
      parameters:
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/Category' } }
        - { name: query, in: query, required: false, schema: { type: string }, description: Search conversation ID or recommended next step. }
        - { name: confidence, in: query, required: false, schema: { $ref: '#/components/schemas/Confidence' } }
        - { name: review_state, in: query, required: false, schema: { type: string, enum: [attention, feedback, overridden, missing_telemetry] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, attention, confidence, slowest, tokens], default: newest } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: A page of analysed conversations., content: { application/json: { schema: { $ref: '#/components/schemas/ListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/analysis/feedback:
    get:
      tags: [analysis]
      operationId: listFeedback
      summary: List explicit feedback with server-side filtering, sorting, and pagination
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [thumbs, outcomes, all], default: thumbs } }
        - { name: region, in: query, required: false, schema: { type: string } }
        - { name: env, in: query, required: false, schema: { type: string, enum: [uit, prod] }, description: Environment (default uit) }
        - { name: rating, in: query, required: false, schema: { type: string, enum: [positive, negative] } }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/Category' } }
        - { name: query, in: query, required: false, schema: { type: string }, description: Search feedback, source metadata, recommendation, or conversation ID. }
        - { name: tenant, in: query, required: false, schema: { type: string }, description: Case-insensitive tenant-name filter. }
        - { name: date_range, in: query, required: false, schema: { type: string, enum: [last_7_days, last_30_days] } }
        - { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: false, schema: { type: string, format: date } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, negative_first], default: newest } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: A page of feedback records with unfiltered summary totals., content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/analysis/conversations/{conversation_id}:
    get:
      tags: [analysis]
      operationId: getConversation
      summary: Full de-identified record for one conversation (FR-4)
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The full record., content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/analysis/conversations/{conversation_id}/override:
    post:
      tags: [analysis]
      operationId: overrideCategory
      summary: Human override of the category (audited)
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideBody' }
      responses:
        '200': { description: Updated record., content: { application/json: { schema: { $ref: '#/components/schemas/OverrideResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/analysis/runs/latest:
    get:
      tags: [analysis]
      operationId: latestRun
      summary: Latest scheduled-run summary (analysed / failed / skipped / unanalysed)
      responses:
        '200': { description: Run summary., content: { application/json: { schema: { $ref: '#/components/schemas/RunSummary' } } } }
  /api/analysis/queue:
    get:
      tags: [analysis]
      operationId: analysisQueue
      summary: Live queue health and queued/in-flight conversation IDs (scoped to one environment)
      parameters:
        - { name: env, in: query, required: false, schema: { type: string, enum: [uit, prod] }, description: Environment (default uit) — the queue view is per-environment }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Queue status., content: { application/json: { schema: { $ref: '#/components/schemas/QueueStats' } } } }
  /api/analysis/runs:
    post:
      tags: [analysis]
      operationId: triggerRun
      summary: Trigger an analysis run (scheduler / reviewer)
      responses:
        '200': { description: Run summary., content: { application/json: { schema: { $ref: '#/components/schemas/RunSummary' } } } }
  /api/analysis/feedback/export:
    get:
      tags: [analysis]
      operationId: feedbackExport
      summary: Download feedback conversations (full detail) as CSV, JSON, or PDF
      description: >-
        Exports ALL feedback conversations in scope (no pagination) with full detail: category,
        confidence, feedback type + user remark, the 3-part root-cause analysis (what happened /
        why / how to avoid), suggestions + recommended action, cost & responsiveness metrics, and
        the full de-identified transcript. Returned as a file attachment.
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, json, pdf], default: csv } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [thumbs, outcomes, all], default: all } }
        - { name: region, in: query, required: false, schema: { type: string } }
        - { name: env, in: query, required: false, schema: { type: string, enum: [uit, prod] }, description: Environment (default uit) }
        - { name: rating, in: query, required: false, schema: { type: string, enum: [positive, negative] } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 200 }, description: Free-text search (same fields as /feedback) }
        - { name: tenant, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: date_range, in: query, required: false, schema: { type: string, enum: [last_7_days, last_30_days] } }
        - { name: date_from, in: query, required: false, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: false, schema: { type: string, format: date } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, oldest, negative_first], default: newest } }
      responses:
        '200':
          description: Export file (attachment).
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: array, items: { type: object } } }
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/analysis/analyze/pending:
    get:
      tags: [analysis]
      operationId: analyzePending
      summary: Manual flow step 1 — fetch (do not analyse) new/unanalysed conversations
      description: >-
        Returns the count of eligible, not-yet-analysed conversations for the selected region
        (or all regions), a per-region breakdown, and brief details for a sample. Does not start
        analysis. Chat-DB source only; other sources return count 0.
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: Region label (e.g. us/eu/uk); omit for all regions }
        - { name: env, in: query, required: false, schema: { type: string, enum: [uit, prod] }, description: Environment (default uit) }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [all, feedback], default: all }, description: 'feedback = only conversations with user feedback; all = every conversation (PROD shows both)' }
      responses:
        '200': { description: Pending summary., content: { application/json: { schema: { $ref: '#/components/schemas/PendingAnalysis' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/analysis/analyze/sweep:
    post:
      tags: [analysis]
      operationId: analyzeSweep
      summary: Manual flow step 2 — start background analysis of not-yet-analysed conversations
      description: >-
        Enqueues eligible, not-yet-analysed conversations for the selected region (or all) and
        returns immediately (deduped; poll GET /api/analysis/queue for progress). Chat-DB source only.
      parameters:
        - { name: region, in: query, required: false, schema: { type: string }, description: Region label; omit for all regions }
        - { name: env, in: query, required: false, schema: { type: string, enum: [uit, prod] }, description: Environment (default uit) }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [all, feedback], default: all }, description: 'feedback = only feedback conversations; all = every conversation' }
      responses:
        '202': { description: Sweep started or already running., content: { application/json: { schema: { $ref: '#/components/schemas/SweepStatus' } } } }
        '400': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: RFC 7807 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Category:
      type: string
      enum: [resolved, failed_to_resolve, positive_feedback, negative_feedback, out_of_scope]
    Confidence: { type: string, enum: [high, medium, low] }
    Status: { type: string, enum: [analysed, failed, pending] }
    Metrics:
      type: object
      description: Per-conversation telemetry. null = unavailable (AC-7), never 0.
      properties:
        ttft_ms: { type: [integer, 'null'] }
        input_tokens: { type: [integer, 'null'] }
        output_tokens: { type: [integer, 'null'] }
        prompt_tokens: { type: [integer, 'null'] }
    Signals:
      type: object
      additionalProperties: true
    Override:
      type: object
      properties:
        category: { $ref: '#/components/schemas/Category' }
        actor: { type: string }
        at: { type: string, format: date-time }
    ListItem:
      type: object
      required: [conversation_id, category, status]
      properties:
        conversation_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        model_category: { $ref: '#/components/schemas/Category' }
        recommended_next_step: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }
        status: { $ref: '#/components/schemas/Status' }
        overridden: { type: boolean }
        has_feedback: { type: boolean }
        metrics: { $ref: '#/components/schemas/Metrics' }
        last_message_at: { type: [string, 'null'], format: date-time }
        analyzed_at: { type: string, format: date-time }
    ListResponse:
      type: object
      required: [items, counts, total, unanalysed]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ListItem' } }
        counts: { type: object, additionalProperties: { type: integer } }
        total: { type: integer }
        unanalysed: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    FeedbackItem:
      type: object
      required: [conversation_id, category, confidence, rating]
      properties:
        conversation_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        model_category: { $ref: '#/components/schemas/Category' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        rating: { type: [boolean, 'null'] }
        comment: { type: [string, 'null'] }
        recommended_next_step: { type: string }
        rationale: { type: string }
        why_it_happened: { type: string }
        input_tokens: { type: [integer, 'null'] }
        output_tokens: { type: [integer, 'null'] }
        last_message_at: { type: [string, 'null'], format: date-time }
        analyzed_at: { type: string, format: date-time }
      additionalProperties: true
    FeedbackListResponse:
      type: object
      required: [items, total, scope_total, positive, negative, negative_outcomes, deep_analysed, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedbackItem' } }
        total: { type: integer }
        scope_total: { type: integer }
        positive: { type: integer }
        negative: { type: integer }
        negative_outcomes: { type: integer }
        deep_analysed: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Message:
      type: object
      required: [id, role, sequence_num]
      properties:
        id: { type: string }
        role: { type: string, enum: [system, user, assistant, live_agent] }
        content: { type: string }
        sequence_num: { type: integer }
        model: { type: [string, 'null'] }
        created_at: { type: string }
    ConversationDetail:
      type: object
      required: [conversation_id, analysis, messages]
      properties:
        conversation_id: { type: string }
        analysis:
          type: object
          properties:
            category: { $ref: '#/components/schemas/Category' }
            model_category: { $ref: '#/components/schemas/Category' }
            recommended_next_step: { type: string }
            confidence: { $ref: '#/components/schemas/Confidence' }
            rationale: { type: string }
            signals: { $ref: '#/components/schemas/Signals' }
            status: { $ref: '#/components/schemas/Status' }
            override: { anyOf: [{ $ref: '#/components/schemas/Override' }, { type: 'null' }] }
            run_id: { type: string }
            analyzer_version: { type: string }
            analyzed_at: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/Metrics' }
        enrichment: { anyOf: [{ $ref: '#/components/schemas/Enrichment' }, { type: 'null' }] }
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        feedback:
          type: object
          properties:
            rating: { type: [boolean, 'null'] }
            comment: { type: [string, 'null'] }
    Enrichment:
      type: object
      description: >-
        Safe, PII/quasi-identifier-scrubbed signals from the JAI orchestrator + LangSmith traces
        (ADR-0018). No secrets (JWT/keys/URLs) or raw identifiers are ever included.
      properties:
        intent: { type: [string, 'null'] }
        secondary_intent: { type: [string, 'null'] }
        agent_used: { type: [string, 'null'] }
        response_type: { type: [string, 'null'] }
        source_confidence: { type: [string, 'null'] }
        retrieval_hit: { type: [boolean, 'null'] }
        retrieved_count: { type: integer }
        retrieved_docs: { type: array, items: { type: string } }
        reasoning_summary: { type: string }
        frustration_score: { type: [number, 'null'] }
        guardrail: { type: [string, 'null'] }
        had_error: { type: [boolean, 'null'] }
        turns: { type: [integer, 'null'] }
        tenant_rules_applied: { type: boolean }
        langsmith_found: { type: boolean }
    OverrideBody:
      type: object
      required: [category, actor]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        actor: { type: string }
    OverrideResult:
      type: object
      properties:
        conversation_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        model_category: { $ref: '#/components/schemas/Category' }
        recommended_next_step: { type: string }
        override: { anyOf: [{ $ref: '#/components/schemas/Override' }, { type: 'null' }] }
    RunSummary:
      type: object
      properties:
        run_id: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        analysed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        unanalysed: { type: integer }
    PendingAnalysis:
      type: object
      required: [count, ids, by_region, items]
      properties:
        count: { type: integer, description: Total new/unanalysed conversations in scope }
        ids: { type: array, items: { type: string }, description: Conversation ids (capped) }
        by_region: { type: object, additionalProperties: { type: integer }, description: Pending count per region }
        items:
          type: array
          description: Brief details for a sample of pending conversations
          items:
            type: object
            properties:
              conversation_id: { type: string }
              region: { type: [string, 'null'] }
              tenant_name: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
              last_message_at: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        source: { type: string }
    SweepStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [started, already_running] }
        region: { type: [string, 'null'] }
        source: { type: string }
    QueueItem:
      type: object
      required: [conversation_id, status, attempt, queued_at]
      properties:
        conversation_id: { type: string }
        status: { type: string, enum: [queued, analysing, retrying] }
        attempt: { type: integer }
        queued_at: { type: string, format: date-time }
    QueueStats:
      type: object
      required: [queued, in_flight, in_flight_or_queued, dead_letter, capacity, workers, started, items, limit, offset]
      properties:
        queued: { type: integer }
        in_flight: { type: integer }
        in_flight_or_queued: { type: integer }
        dead_letter: { type: integer }
        capacity: { type: integer }
        workers: { type: integer }
        started: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }
        limit: { type: integer }
        offset: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
